name: 📱 Build Android APK (FiberOps Technician)

on:
  workflow_dispatch:
  push:
    tags:
      - 'v*.*.*'

jobs:
  build-apk:
    name: Build Ionic + Capacitor Android APK
    runs-on: ubuntu-latest

    steps:
      - name: 📁 Checkout Repository
        uses: actions/checkout@v4

      - name: 🟢 Setup Node.js 20
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'

      - name: ☕ Setup Java 21
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '21'

      - name: 🤖 Setup Android SDK
        uses: android-actions/setup-android@v3

      - name: 🏗️ Build Production Web Bundle & Sync Capacitor
        run: |
          npm ci
          npx ng build --configuration production --base-href ./
          npx cap sync android

      - name: 📦 Compile Android Debug APK
        working-directory: ./android
        run: |
          chmod +x ./gradlew
          ./gradlew assembleDebug --no-daemon

      - name: 📤 Upload FiberOps Technician APK Artifact
        uses: actions/upload-artifact@v4
        with:
          name: FiberOps-Technician-APK-${{ github.ref_name }}
          path: android/app/build/outputs/apk/debug/app-debug.apk
          retention-days: 30
