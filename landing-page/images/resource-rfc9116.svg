<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 450" width="800" height="450" role="img" aria-label="RFC 9116 and HTTP Security Headers Compliance Illustration">
  <defs>
    <linearGradient id="bg1" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#f8fafc"/>
      <stop offset="100%" stop-color="#e8eff7"/>
    </linearGradient>
  </defs>
  <rect width="800" height="450" fill="url(#bg1)"/>
  <circle cx="670" cy="70" r="140" fill="#0f3559" fill-opacity="0.06"/>
  <circle cx="110" cy="400" r="120" fill="#e8913a" fill-opacity="0.09"/>
  <!-- Clean Architectural Code/Header Card -->
  <rect x="86" y="66" width="440" height="318" rx="12" fill="#ffffff" stroke="#cbd5e1" stroke-width="1.5"/>
  <rect x="86" y="66" width="440" height="42" rx="12" fill="#0f3559"/>
  <rect x="86" y="96" width="440" height="12" fill="#0f3559"/>
  <text x="112" y="92" font-family="Inter, Segoe UI, sans-serif" font-size="13" font-weight="700" fill="#ffffff">/.well-known/security.txt • HTTP Headers</text>
  <rect x="112" y="132" width="136" height="26" rx="13" fill="#ecfdf5"/>
  <text x="180" y="149" text-anchor="middle" font-family="Inter, Segoe UI, sans-serif" font-size="11.5" font-weight="800" fill="#059669">RFC 9116 VALID</text>
  <rect x="260" y="132" width="126" height="26" rx="13" fill="#fff5ea"/>
  <text x="323" y="149" text-anchor="middle" font-family="Inter, Segoe UI, sans-serif" font-size="11.5" font-weight="800" fill="#d07e2e">HSTS PRELOAD</text>
  <g font-family="Consolas, monospace" font-size="13.5" fill="#1e293b">
    <text x="112" y="196">Strict-Transport-Security: max-age=31536000</text>
    <text x="112" y="226">Content-Security-Policy: default-src 'self'</text>
    <text x="112" y="256">X-Frame-Options: SAMEORIGIN</text>
    <text x="112" y="286">X-Content-Type-Options: nosniff</text>
    <text x="112" y="316" fill="#059669">Contact: mailto:security@bentengsiber.com</text>
    <text x="112" y="346" fill="#0f3559">Policy: https://bentengsiber.com/privacy</text>
  </g>
  <!-- Shield Emblem Right -->
  <g transform="translate(570, 128)">
    <rect x="0" y="0" width="150" height="194" rx="14" fill="#0f3559"/>
    <path d="M75 34 L120 52 L117 104 C115 130 96 150 75 160 C54 150 35 130 33 104 L30 52 Z" fill="#1a4a7a" stroke="#ffffff" stroke-width="3"/>
    <path d="M56 96 L70 110 L98 78" fill="none" stroke="#e8913a" stroke-width="6" stroke-linecap="round" stroke-linejoin="round"/>
  </g>
</svg>
