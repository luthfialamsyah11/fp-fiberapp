<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 450" width="800" height="450" role="img" aria-label="Zero-Trust ISP Network and FiberOps Field Architecture Illustration">
  <defs>
    <linearGradient id="bg2" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#f6f7f9"/>
      <stop offset="100%" stop-color="#eaf0f7"/>
    </linearGradient>
  </defs>
  <rect width="800" height="450" fill="url(#bg2)"/>
  <!-- Subtle Grid -->
  <g stroke="#cbd5e1" stroke-opacity="0.35" stroke-width="1">
    <line x1="0" y1="112" x2="800" y2="112"/>
    <line x1="0" y1="225" x2="800" y2="225"/>
    <line x1="0" y1="338" x2="800" y2="338"/>
    <line x1="200" y1="0" x2="200" y2="450"/>
    <line x1="400" y1="0" x2="400" y2="450"/>
    <line x1="600" y1="0" x2="600" y2="450"/>
  </g>
  <!-- Connecting Fiber Lines -->
  <path d="M180 225 L350 225 M450 225 L620 140 M450 225 L620 310" stroke="#0f3559" stroke-width="3" stroke-dasharray="8 6" fill="none"/>
  <!-- Node 1: OLT Core -->
  <rect x="64" y="168" width="140" height="114" rx="12" fill="#0f3559"/>
  <text x="134" y="214" text-anchor="middle" font-family="Inter, Segoe UI, sans-serif" font-size="14" font-weight="800" fill="#ffffff">NOC / OLT</text>
  <text x="134" y="238" text-anchor="middle" font-family="Inter, Segoe UI, sans-serif" font-size="11" fill="#f4a94f">RBAC Segmented</text>
  <rect x="96" y="252" width="76" height="14" rx="7" fill="#1a4a7a"/>
  <!-- Center Gate: Zero-Trust API -->
  <circle cx="400" cy="225" r="66" fill="#ffffff" stroke="#e8913a" stroke-width="4"/>
  <circle cx="400" cy="225" r="46" fill="#fff5ea"/>
  <text x="400" y="220" text-anchor="middle" font-family="Inter, Segoe UI, sans-serif" font-size="13" font-weight="800" fill="#0f3559">ZERO-TRUST</text>
  <text x="400" y="240" text-anchor="middle" font-family="Inter, Segoe UI, sans-serif" font-size="11.5" font-weight="700" fill="#d07e2e">ANTI-IDOR API</text>
  <!-- Right Top: Field Technician PWA -->
  <rect x="596" y="88" width="152" height="104" rx="12" fill="#ffffff" stroke="#cbd5e1" stroke-width="1.5"/>
  <text x="672" y="130" text-anchor="middle" font-family="Inter, Segoe UI, sans-serif" font-size="13.5" font-weight="800" fill="#0f3559">Field PWA</text>
  <text x="672" y="152" text-anchor="middle" font-family="Inter, Segoe UI, sans-serif" font-size="11" fill="#475569">GPS Geofence + Offline</text>
  <rect x="630" y="164" width="84" height="16" rx="8" fill="#ecfdf5"/>
  <text x="672" y="176" text-anchor="middle" font-family="Inter, Segoe UI, sans-serif" font-size="9.5" font-weight="800" fill="#059669">SANCTUM AUTH</text>
  <!-- Right Bottom: Public Tracking -->
  <rect x="596" y="258" width="152" height="104" rx="12" fill="#ffffff" stroke="#cbd5e1" stroke-width="1.5"/>
  <text x="672" y="300" text-anchor="middle" font-family="Inter, Segoe UI, sans-serif" font-size="13.5" font-weight="800" fill="#0f3559">Public /track</text>
  <text x="672" y="322" text-anchor="middle" font-family="Inter, Segoe UI, sans-serif" font-size="11" fill="#475569">24h Expiring Token</text>
  <rect x="626" y="334" width="92" height="16" rx="8" fill="#fff5ea"/>
  <text x="672" y="346" text-anchor="middle" font-family="Inter, Segoe UI, sans-serif" font-size="9.5" font-weight="800" fill="#d07e2e">RATE LIMITED</text>
</svg>
